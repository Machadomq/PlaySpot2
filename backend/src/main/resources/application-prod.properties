# Produção: sem valores padrão de propósito. Se faltar alguma variável, o app não sobe.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${PGSSLMODE}
# Poucas conexões: o plano gratuito tem pouca memória e o banco também limita conexões
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

playspot.jwt.secret=${JWT_SECRET}
playspot.arquivos.diretorio=${ARQUIVOS_DIR}

server.port=${PORT:8080}
