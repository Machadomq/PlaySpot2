spring.application.name=playspot

# Banco de dados (ambiente de desenvolvimento, ver docker-compose.yml na raiz)
spring.datasource.url=jdbc:postgresql://localhost:5432/playspot
spring.datasource.username=playspot
spring.datasource.password=playspot

# O schema é controlado pelo Flyway; o Hibernate só valida se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Token JWT. O segredo abaixo é SÓ para desenvolvimento: em produção defina a variável de ambiente JWT_SECRET.
playspot.jwt.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento-troque-em-producao}
playspot.jwt.expiracao-minutos=120

# Fotos das quadras
playspot.arquivos.diretorio=dados/arquivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
